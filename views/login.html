<!-- ==========================================
     MILESTONE 2: LOGIN TEMPLATE
     ========================================== -->
{% extends "base.html" %}

{% block title %}Login - EMP 0.2{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="emp-card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-navy">Welcome to EMP 0.2</h3>
                <p class="text-muted">Sign in to your account with your registered email</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-emp-primary btn-lg">Sign In</button>
                </div>
            </form>

            <hr class="my-4">

            <div class="text-center small">
                <p class="mb-1">New student? <a href="{{ url_for('student_register') }}" class="text-decoration-none fw-semibold">Register as Student</a></p>
                <p class="mb-0">Faculty / Examiner? <a href="{{ url_for('examiner_register') }}" class="text-decoration-none fw-semibold">Register as Examiner</a></p>
            </div>
        </div>

        <div class="text-center small text-muted">
            <span class="badge bg-light text-dark border">Default Admin: admin@emp.gov / admin123</span>
        </div>
    </div>
</div>
{% endblock %}
