<!-- ==========================================
     MILESTONE 2: STUDENT REGISTRATION TEMPLATE
     ========================================== -->
{% extends "base.html" %}

{% block title %}Student Registration - EMP 0.2{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="emp-card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-navy">Student Registration</h3>
                <p class="text-muted">Create your student account to discover and book examination slots</p>
            </div>

            <form method="POST" action="{{ url_for('student_register') }}">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. John Doe" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="student_id" class="form-label">Student ID / Roll Number</label>
                        <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. 23BCA1042" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Department / Branch</label>
                        <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="student@example.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 characters" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-emp-primary btn-lg">Create Student Account</button>
                </div>
            </form>

            <div class="text-center small mt-3">
                <p class="mb-0">Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
